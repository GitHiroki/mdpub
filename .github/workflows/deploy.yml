name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=mdpub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify Slack
        if: success()
        run: |
          BASE_URL="https://mdpub-56e.pages.dev"
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD^1...HEAD -- 'src/content/docs/' 2>/dev/null || true)

          MESSAGE="mdpub デプロイ完了 🚀"

          if [ -n "$NEW_FILES" ]; then
            LINKS=""
            while IFS= read -r file; do
              path="${file#src/content/docs/}"
              path="${path%.md}"
              LINKS="${LINKS}\n• ${BASE_URL}/${path}/"
            done <<< "$NEW_FILES"
            MESSAGE="${MESSAGE}\n新規ページ:${LINKS}"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$(echo -e "$MESSAGE")\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}